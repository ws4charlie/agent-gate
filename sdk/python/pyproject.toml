[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "Thin Python client for the AgentGate gateway"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["agentgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

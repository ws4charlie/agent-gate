name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AG_REQUIRE_DB: "1"
      DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: no real emails or secrets in tracked files
        run: scripts/check-leaks.sh
      - name: no file over 1 MB and no executable binary added
        run: |
          base=${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
          case $base in 0000000000000000000000000000000000000000) exit 0 ;; esac
          git fetch --no-tags --depth=1 origin "$base"
          scripts/check-added-files.sh FETCH_HEAD
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  # The policy benchmark: scored scenarios against the assembled gateway on fakes.
  # Exits non-zero on any mismatch. It rewrites results.md, and the
  # last step fails if the committed copy differs, so the published numbers are always current.
  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: run the benchmark
        run: go run ./benchmark
      - name: results.md is committed
        run: git diff --exit-code -- benchmark/results.md

  # The Python SDK against a real gateway built from this commit (Go binaries, fakes, simulated chain).
  sdk-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AG_REQUIRE_DB: "1"
      DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install the SDK and pytest
        run: pip install "./sdk/python[test]"
      - name: pytest
        run: python -m pytest sdk/python/tests -q
      - name: runner unit tests
        run: python3 -m unittest discover scripts/runners

  # Full end to end with no secrets and no network beyond loopback.
  #  - Payments: a real local anvil node (chain id 84532, the testnet's) over real JSON-RPC, with a mock USDC.
  #  - Model traffic: recorded prompt fixtures (testdata/llm) replayed over real HTTP and SSE.
  # Proves the RPC, fee and receipt path and the gateway's accounting. It does not prove Circle's real
  # USDC contract or any provider's behaviour. See docs/testing.md.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AG_REQUIRE_DB: "1"
      AG_REQUIRE_ANVIL: "1"
      AG_ANVIL_URL: http://127.0.0.1:8545
      AG_RPC_URL: http://127.0.0.1:8545
      DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
      PGHOST: localhost
      PGUSER: postgres
      # A placeholder, not a secret: it cannot authenticate anywhere. Every provider base URL in
      # configs/providers.mock.json is on 127.0.0.1, so an outbound call has nowhere to go.
      OPENROUTER_API_KEY: mock
      ANTHROPIC_API_KEY: mock
    steps:
      - uses: actions/checkout@v4
      - name: no secret is configured in any workflow
        run: |
          if grep -nE 'secrets\.|secrets\[' .github/workflows/*.yml | grep -v 'grep -nE'; then
            echo "a workflow references a secret"; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A pinned Foundry release, checked against its pinned SHA-256 (the
      # value in the release's own .sha256 file). foundryup also fetches the
      # release's attestation from a separate GitHub endpoint, and that
      # endpoint's outages (504s) failed the job before any test ran.
      - name: install Foundry v1.9.0
        run: |
          set -euo pipefail
          f=foundry_v1.9.0_linux_amd64.tar.gz
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$f" \
            "https://github.com/foundry-rs/foundry/releases/download/v1.9.0/$f"
          echo "8d17599b42e3139f1a9c171be3798c4ed8e743ae17b84cc3435e57bf2a51ae99  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$HOME/.foundry/bin" anvil cast forge
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          "$HOME/.foundry/bin/anvil" --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install the SDK and pytest
        run: pip install "./sdk/python[test]"
      - name: start anvil (chain id 84532)
        run: |
          anvil --chain-id 84532 --silent > anvil.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"web3_clientVersion","params":[]}' "$AG_ANVIL_URL" && echo && exit 0
            sleep 0.2
          done
          cat anvil.log; exit 1
      - name: e2e tests (anvil payments, fixture LLM traffic)
        run: go test -count=1 -p 1 -timeout 20m -v ./e2e/...
      # The paid tool with --token, on the same anvil. AG_REQUIRE_ANVIL=1 (job env) makes it fail, not skip, without a node.
      - name: paid tool accepts an existing token (anvil)
        run: go test -count=1 -timeout 5m -v -run 'TestPaidtoolUsesExistingToken$' ./cmd/agentgate
      - name: Python agents on fixtures
        run: python -m pytest sdk/python/tests -q -k fixtures
      - name: anvil log
        if: failure()
        run: cat anvil.log

  # The Helm chart, offline: lint and render on sim and on a chain (scripts/check-chart.sh).
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A pinned release, checked against its pinned SHA-256 (the release's own .sha256sum file).
      - name: install helm v4.3.2
        run: |
          set -euo pipefail
          h=helm-v4.3.2-linux-amd64.tar.gz
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$h" "https://get.helm.sh/$h"
          echo "d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983  $RUNNER_TEMP/$h" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$h" -C /usr/local/bin --strip-components=1 linux-amd64/helm
          helm version
      - name: chart lint, render, env names
        run: scripts/check-chart.sh

  # Terraform and policy checks, offline. CI never touches GCP: no credentials, no plan.
  # The lead runs `terraform plan` locally. See docs/infra.md.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false
      # Pinned releases, checked against pinned SHA-256 values.
      - name: install OPA and conftest
        run: |
          set -euo pipefail
          o=opa_linux_amd64_static
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$o" \
            "https://github.com/open-policy-agent/opa/releases/download/v1.22.4/$o"
          echo "35e3b352e715e80624ead6c89930d8585f6f7d94cdc409eb2a9fe36620dcccba  $RUNNER_TEMP/$o" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/$o" /usr/local/bin/opa
          c=conftest_0.71.1_Linux_x86_64.tar.gz
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$c" \
            "https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/$c"
          echo "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  $RUNNER_TEMP/$c" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$c" -C /usr/local/bin conftest
          opa version
          conftest --version
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: terraform init
        run: terraform -chdir=infra/terraform init -backend=false
      - name: terraform validate
        run: terraform -chdir=infra/terraform validate
      - name: opa test
        run: opa test infra/policy -v
      # The policies live in package terraform.agentgate, so the namespace must be named,
      # or conftest runs nothing. The guard fails the step if no check was evaluated.
      - name: conftest
        run: |
          set -euo pipefail
          conftest test --parser hcl2 --combine --namespace terraform.agentgate -p infra/policy infra/terraform/*.tf
          n=$(conftest test --parser hcl2 --combine --namespace terraform.agentgate -p infra/policy infra/terraform/*.tf --output json | jq '[.[] | (.successes // 0) + ((.failures // []) | length)] | add // 0')
          echo "checks evaluated: $n"
          test "$n" -gt 0

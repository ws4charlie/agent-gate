<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgentGate">
  <title>AgentGate</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- the gate: two posts and an arch every agent passes under -->
  <path d="M8 58V26a24 24 0 0 1 48 0v32h-9V27a15 15 0 0 0-30 0v31z" fill="url(#g)"/>
  <!-- the agent: a small robot head standing in the opening -->
  <rect x="22" y="33" width="20" height="16" rx="5" fill="#e8ecf8"/>
  <circle cx="28.5" cy="41" r="2.4" fill="#0b1020"/>
  <circle cx="35.5" cy="41" r="2.4" fill="#0b1020"/>
  <path d="M32 33v-4" stroke="#e8ecf8" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="27.5" r="2.2" fill="#22d3ee"/>
  <!-- the check the gate makes -->
  <path d="M4 58h56" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
</svg>

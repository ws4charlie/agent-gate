# SPIRE server for one VM. No secrets here: the join token is made at run time.
server {
    bind_address = "127.0.0.1"
    bind_port = "8081"
    trust_domain = "agentgate.internal"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"
    # Workload certificates live one hour; the agent renews them on its own.
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
}

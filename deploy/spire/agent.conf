# SPIRE agent for the same VM. The join token is passed on the command line
# once (-joinToken), never stored in this file.
agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    server_address = "127.0.0.1"
    server_port = "8081"
    trust_domain = "agentgate.internal"
    socket_path = "/run/spire/agent/sockets/agent.sock"
    # First start: fetch the server's trust bundle from this file instead of
    # trusting the network. See README step 4.
    trust_bundle_path = "/opt/spire/conf/bootstrap.crt"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/data/agent"
        }
    }

    # Identifies a workload by the unix user of the calling process.
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}

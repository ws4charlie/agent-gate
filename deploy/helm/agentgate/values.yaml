# AgentGate chart. Safe defaults: payments off, paid tool off, no NetworkPolicy.
# Secrets are never generated here: every secret is the name of a Secret that
# already exists in the release namespace. See docs/infra.md.

image:
  repository: agentgate
  tag: ""            # default: the chart's appVersion
  digest: ""         # sha256:...; when set, the image is repository@digest and tag is ignored
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""           # default: the release's full name

# Postgres. The gateway runs the embedded migrations at start (advisory lock,
# safe with several replicas).
database:
  existingSecret: "" # required: Secret holding the Postgres URL
  key: DATABASE_URL

# Model provider keys: a Secret whose keys are the env names the gateway
# reads (<NAME>_API_KEY, e.g. OPENROUTER_API_KEY). Empty: none.
providerKeys:
  existingSecret: ""

# Chain JSON-RPC URL (AG_RPC_URL) for the gateway's reconciler and the paid
# tool. Required when payments.network or paidtool.network is anvil or
# base-sepolia; sim ignores it. Set exactly one: rpcUrl for a URL that holds
# no secret (in-cluster anvil), rpcUrlSecret for one that carries a provider
# API key.
chain:
  rpcUrl: ""
  rpcUrlSecret:
    name: ""
    key: AG_RPC_URL

gateway:
  replicas: 1
  port: 8080
  logFormat: json              # AG_LOG_FORMAT
  registryEnforce: false       # AG_REGISTRY_ENFORCE
  # Cedar policies as files (name.cedar: content), mounted as a directory
  # (AG_CEDAR_POLICIES). Empty: Cedar off.
  cedarPolicies: {}
  cedarEnforce: false          # AG_CEDAR_ENFORCE (needs cedarPolicies)
  otelExporter: ""             # AG_OTEL_EXPORTER: stdout | otlp; empty: off
  # Optional JSON config file (AG_CONFIG); listen and database_url are set by
  # the chart and must not be given here.
  config: {}                   # e.g. {max_hold_nanos: 1000000000, default_max_tokens: 4096}
  # Providers and routes (AG_PROVIDERS) and the price table (AG_PRICES),
  # written to a ConfigMap and mounted. The defaults route nothing.
  providers: {providers: {}, routes: []}
  prices: {models: {}}
  # MCP upstream servers (AG_MCP). Empty: /mcp/{server} is off.
  mcp: {}
  extraEnv: []                 # plain env entries, added last
  extraEnvFrom: []
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# x402 payments (AG_PAYMENTS). Off by default.
payments:
  enabled: false
  network: ""                  # required when enabled: sim | anvil | base-sepolia
  maxTxUSD: ""                 # the signer's own per-transaction cap; empty: $1
  tools: {}                    # tool name -> URL
  # Tools served by this release's paid tool (when paidtool.enabled): each
  # name becomes http://<paidtool service>:<port>/<name>.
  paidtoolTools: []            # e.g. [echo, premium]
  # sim only: the paid tool's base URL; default this release's paid tool.
  chainQueryURL: ""

# QuorumVault, the only signer on a chain: required when payments.enabled and
# payments.network is anvil or base-sepolia (on sim the gateway signs with a
# throw-away key and these are unused). Non-secret settings as values; files
# from Secrets.
vault:
  url: ""                      # AG_VAULT_URL
  walletId: ""                 # AG_VAULT_WALLET_ID
  walletAddress: ""            # AG_VAULT_WALLET_ADDRESS
  tokenUrl: ""                 # AG_VAULT_TOKEN_URL
  clientId: ""                 # AG_VAULT_CLIENT_ID
  audience: ""                 # AG_VAULT_AUDIENCE
  credTTL: ""                  # AG_VAULT_CRED_TTL, default 90s
  # One Secret with the mTLS files, the CA and the client secret, e.g.
  # made from QuorumVault's onboarding output directory.
  existingSecret: ""
  keys:
    cert: tls.crt              # AG_VAULT_CERT
    key: tls.key               # AG_VAULT_KEY
    ca: ca.crt                 # AG_VAULT_CA
    clientSecret: client_secret  # AG_VAULT_CLIENT_SECRET_FILE
    tokenCA: token_ca.crt      # AG_VAULT_TOKEN_CA; empty: system roots

# The Gate credential key (QuorumVault signer). The gateway accepts only a regular
# file owned by its own user, mode 0600, in a directory no one else can write.
# A Secret volume is none of these, so an init container (this image,
# `agentgate gatecred install`) copies it into a private in-memory directory.
gateCred:
  existingSecret: ""           # required with payments on anvil or base-sepolia
  key: gate-cred.key
  kid: ""                      # AG_GATE_CRED_KID, required with payments on anvil or base-sepolia

# The x402 seller with its own facilitator (`agentgate paidtool`).
paidtool:
  enabled: false
  port: 9402
  network: sim                 # sim | anvil | base-sepolia
  payTo: ""                    # required when enabled: address that receives payment
  fund: ""                     # anvil only: mint this many USDC at start (on sim the
  fundAddress: ""              # gateway's key is made at start, so there is nothing to fund)
  # anvil: accept this already deployed EIP-3009 token (e.g. QuorumVault's
  # mock USDC, onboarding output usdc_address) instead of deploying a mock.
  token: ""
  # base-sepolia: Secret holding AG_FACILITATOR_KEY (pays gas to settle).
  facilitatorKey:
    existingSecret: ""
    key: AG_FACILITATOR_KEY
  extraArgs: []
  extraEnv: []
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 256Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

# Default deny for both pods, then only what is listed. Each egress group is a
# list of NetworkPolicyEgressRule (to + ports). DNS to kube-dns is always allowed.
# When enabled, postgres is required, and with payments on a chain so are vault and
# tokenProvider, each rule with ports. Model providers and MCP upstreams go in extra.
networkPolicy:
  enabled: false
  # Who may call the gateway. Default: any pod in the release namespace.
  gatewayIngressFrom:
    - podSelector: {}
  egress:
    postgres: []               # e.g. [{to: [{podSelector: {matchLabels: {cnpg.io/cluster: gate-db}}}], ports: [{port: 5432}]}]
    vault: []                  # QuorumVault core (payments on a chain)
    tokenProvider: []          # the identity provider's token endpoint (payments on a chain)
    chainRpc: []               # gateway reconciler and paid tool
    extra: []                  # anything else, e.g. model providers

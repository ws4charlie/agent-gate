# CI render: vault signer with every optional setting, anvil, paid tool. Placeholders only.
database: {existingSecret: agentgate-db}
chain: {rpcUrlSecret: {name: agentgate-rpc}}   # the Secret form; values-local.yaml uses the literal
payments:
  enabled: true
  network: anvil
  paidtoolTools: [echo]
vault:
  url: https://core.example.invalid
  walletId: 00000000-0000-4000-8000-000000000001
  walletAddress: "0x0000000000000000000000000000000000000001"
  tokenUrl: https://idp.example.invalid/token
  clientId: agentgate
  audience: quorumvault
  credTTL: 60s
  existingSecret: agentgate-vault
gateCred: {existingSecret: agentgate-gate-cred, kid: gate-test}
paidtool:
  enabled: true
  network: anvil
  payTo: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
networkPolicy:
  enabled: true
  egress:
    postgres: [{to: [{podSelector: {matchLabels: {cnpg.io/cluster: agentgate-db}}}], ports: [{port: 5432}]}]
    vault: [{to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: qv}}}], ports: [{port: 8443}]}]
    tokenProvider: [{to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: qv}}}], ports: [{port: 8443}]}]
    chainRpc: [{to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: qv}}}], ports: [{port: 8545}]}]

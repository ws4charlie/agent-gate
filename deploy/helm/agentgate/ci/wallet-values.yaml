# CI render: wallet signer, sim network, paid tool, NetworkPolicy. Secret names only.
database: {existingSecret: agentgate-db}
signer: wallet
providerKeys: {existingSecret: agentgate-provider-keys}
gateway:
  registryEnforce: true
  cedarPolicies: {agentgate.cedar: "permit(principal, action, resource);"}
  cedarEnforce: true
  otelExporter: stdout
  config: {default_max_tokens: 4096}
  mcp: {servers: {}}
payments:
  enabled: true
  network: sim
  maxTxUSD: "0.5"
  paidtoolTools: [echo, premium]
wallet: {existingSecret: agentgate-wallet}
paidtool:
  enabled: true
  payTo: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
  fund: "5"
  fundAddress: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
networkPolicy:
  enabled: true
  egress:
    postgres: [{to: [{podSelector: {matchLabels: {app: pg}}}], ports: [{port: 5432}]}]
